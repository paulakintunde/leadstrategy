version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
      tooling:
        patterns: ["wrangler", "typescript"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
